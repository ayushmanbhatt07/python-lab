<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato - Discover the best food near you</title>
    <meta name="description" content="Find the best restaurants, cafes and bars in your city with Zomato">
    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('zomatobackground\(1\).png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            display: flex;
            flex-direction: column;
        }

        /* Header Styles */
        .header {
            text-align: center;
            padding: 2rem 1rem;
            margin-top: 2rem;
        }

        .header h1 {
            font-size: 5rem;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 0.5rem;
        }

        .header h2 {
            font-size: 1.5rem;
            font-weight: 300;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        /* Search Container */
        .search-container {
            display: flex;
            justify-content: center;
            margin: 2rem auto;
            max-width: 800px;
            width: 90%;
        }

        .search-input {
            padding: 0.8rem 1rem;
            font-size: 1rem;
            border: none;
            outline: none;
            font-family: inherit;
        }

        .location-container {
            position: relative;
            width: 150px;
        }

        .location-select {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            border: none;
            border-radius: 5px 0 0 5px;
            appearance: none;
            background-color: white;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.7rem center;
            background-size: 1rem;
            cursor: pointer;
        }

        .search-restaurant {
            width: 100%;
            max-width: 500px;
        }

        .search-button {
            padding: 0 1.5rem;
            background-color: #FF4E4E;
            color: white;
            border: none;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background-color 0.3s;
        }

        .search-button:hover {
            background-color: #E43A3A;
        }

        /* Auth Buttons */
        .auth-buttons {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .auth-button {
            padding: 0.5rem 1rem;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login {
            background-color: transparent;
            border: 1px solid white;
            color: white;
        }

        .login:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .signup {
            background-color: white;
            border: 1px solid white;
            color: #FF4E4E;
        }

        .signup:hover {
            background-color: #f0f0f0;
        }

        /* Footer */
        footer {
            margin-top: auto;
            padding: 2rem 1rem;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            list-style: none;
        }

        .footer-links a {
            color: white;
            font-weight: 600;
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s;
            padding: 0.5rem;
        }

        .footer-links a:hover {
            color: #FF4E4E;
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 3.5rem;
            }
            
            .header h2 {
                font-size: 1.2rem;
            }
            
            .search-container {
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
            }
            
            .location-container {
                width: 100%;
                max-width: 300px;
            }
            
            .location-select {
                border-radius: 5px;
            }
            
            .search-restaurant {
                border-radius: 5px;
            }
            
            .search-button {
                border-radius: 5px;
                padding: 0.8rem;
                width: 100%;
                max-width: 300px;
            }
            
            .footer-links {
                gap: 1rem;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 2.5rem;
            }
            
           
            
            .footer-links {
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
            }
        }
        .login{
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    background-color: rgb(191, 178, 178);
    color: white;
    cursor: pointer;
    position: absolute;

}
.signup {
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    background-color: rgb(191, 178, 178);
    color: white;
    cursor: pointer;
    position: absolute;
}

/* Positioning the buttons */
.login {
    top: 0;
    left: 0;
}
.signup {
    top: 0;
    right: 0;
}
    </style>
</head>
<body>
    
    <div class="loginorsignup">
        <button class="login"><a target="_blank" href="https://www.zomato.com/login">Log-In</a></button>
        <button class="signup"><a target="_blank" href="https://www.zomato.com/login"> Sign Up</a> </button>
    </div>
    <header class="header">
        <h1>Zomato</h1>
        <h2>Discover the best food places across the country...</h2>
    </header>
   
    <div class="search-container">
        <div class="location-container">
            <select class="location-select" aria-label="Select location">
                <option value="" disabled selected>📍 Select location</option>
                <option value="surat">Surat</option>
                <option value="vadodara">Vadodara</option>
                <option value="ahmedabad">Ahmedabad</option>
                <option value="vapi">Vapi</option>
                <option value="mumbai">Mumbai</option>
                <option value="delhi">Delhi</option>
                <option value="bangalore">Bangalore</option>
                <option value="hyderabad">Hyderabad</option>
                <option value="pune">Pune</option>
                <option value="chennai">Chennai</option>
            </select>
        </div>
        <input type="text" class="search-input search-restaurant" placeholder="Search for restaurant, cuisine or a dish..." aria-label="Search restaurants">
        <button class="search-button" aria-label="Search">🔍</button>
    </div>

    <footer>
        <ul class="footer-links">
            <li><a href="https://www.zomato.com/vadodara" target="_blank" rel="noopener noreferrer">Vadodara</a></li>
            <li><a href="https://www.zomato.com/Surat" target="_blank" rel="noopener noreferrer">Surat</a></li>
            <li><a href="https://www.zomato.com/Ahemdabad" target="_blank" rel="noopener noreferrer">Ahmedabad</a></li>
            <li><a href="https://www.zomato.com/Vapi" target="_blank" rel="noopener noreferrer">Vapi</a></li>
        </ul>
    </footer>
</body>
</html>
